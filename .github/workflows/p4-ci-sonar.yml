# PLANTILLA: copiar a .github/workflows/p4-ci-sonar.yml del repositorio del grupo
# Antes de activar, reemplazar TODOS los campos <<...>>. No debe ejecutarse desde esta carpeta docente.
name: ProyectoP4 - Maven JUnit Cucumber JaCoCo SonarQube

on:
  push:
    branches: [main]
    paths:
      - 'P4/P4_ALLPGP/**'
      - '.github/workflows/p4-ci-sonar.yml'
  pull_request:
    paths:
      - 'P4/P4_ALLPGP/**'
      - '.github/workflows/p4-ci-sonar.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'P4/P4_ALLPGP'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: 'P4/P4_ALLPGP/pom.xml'
      - name: Maven - compilar, JUnit, Cucumber y JaCoCo
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Publicar evidencias de prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-test-reports
          path: |
            P4/P4_ALLPGP/target/surefire-reports/
            P4/P4_ALLPGP/target/site/jacoco/
            P4/P4_ALLPGP/target/jacoco.exec
          if-no-files-found: warn

  sonarqube:
    needs: test
    # En PR externos no se exponen secretos. Verificar accesibilidad de sast.inf.um.es desde el runner.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'P4/P4_ALLPGP'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: 'P4/P4_ALLPGP/pom.xml'
      - name: Maven - verificar y enviar análisis a SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          mvn --batch-mode --no-transfer-progress clean verify
          mvn --batch-mode --no-transfer-progress org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true
