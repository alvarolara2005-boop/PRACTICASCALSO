name: P3 - JUnit JaCoCo PIT

on:
  push:
    branches:
      - main
      - <<RAMA_P3_ALUMNO_1>>
      - <<RAMA_P3_ALUMNO_2>>
    paths:
      - 'P3/P3-Calso-Base/**'
      - '.github/workflows/p3-quality.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'P3/P3-Calso-Base/*'
      - '.github/workflows/p3-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-coverage:
    name: JUnit y JaCoCo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: P3/P3-Calso-Base
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: P3/P3-Calso-Base/pom.xml
      - name: Ejecutar JUnit y JaCoCo
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Publicar informes JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-junit
          path: P3/P3-Calso-Base/target/surefire-reports/
          if-no-files-found: warn
      - name: Publicar JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-jacoco
          path: P3/P3-Calso-Base/target/site/jacoco/
          if-no-files-found: warn

  mutation-testing:
    name: PIT - servicios de dominio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: P3/P3-Calso-Base
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: P3/P3-Calso-Base/pom.xml
      - name: Ejecutar PIT
        run: mvn --batch-mode --no-transfer-progress -Pmutation test pitest:mutationCoverage
      - name: Publicar informe PIT
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-pit
          path: P3/P3-Calso-Base/target/pit-reports/
          if-no-files-found: warn
